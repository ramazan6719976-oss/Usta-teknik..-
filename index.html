<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Usta Teknik · Tablet</title>
<style>
:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --line: #d9d2c4;
  --ink: #1a2420;
  --muted: #6b655c;
  --primary: #1d4a42;
  --accent: #c45c26;
  --accent-fg: #fff8f3;
  --touch: 48px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.45;
  min-height: 100dvh;
}
button, input, select, textarea { font: inherit; }
button, .btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
.app { max-width: 1400px; margin: 0 auto; padding: 16px 16px 110px; }
.top {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  justify-content: space-between; margin-bottom: 14px;
}
.brand { display: flex; gap: 14px; align-items: center; min-width: 0; }
.brand img { height: 64px; width: auto; border-radius: 10px; background: #000; object-fit: contain; padding: 2px; }
.brand h1 { margin: 0; font-size: 1.4rem; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.shell { display: block; }
.nav {
  display: flex; flex-wrap: wrap; gap: 8px; overflow-x: visible; padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
}
.nav::-webkit-scrollbar { display: none; }
.nav button {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; min-height: var(--touch); padding: 12px 18px;
  white-space: nowrap; cursor: pointer; font-weight: 600; font-size: 1rem;
}
.nav button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 18px; margin-bottom: 14px;
}
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.grid4 { display: grid; gap: 14px; grid-template-columns: repeat(4, 1fr); }
.field {
  width: 100%; border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; background: #fff; min-height: var(--touch); font-size: 1.05rem;
}
label.block { display: grid; gap: 6px; font-size: 1rem; }
label.block span { color: var(--muted); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  border: 0; border-radius: 12px; min-height: var(--touch); padding: 12px 18px;
  cursor: pointer; background: var(--primary); color: #fff; font-weight: 700; font-size: 1rem;
}
.btn.accent { background: var(--accent); color: var(--accent-fg); }
.btn.line { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.quiet { background: transparent; color: var(--muted); border: 0; text-decoration: underline; min-height: auto; padding: 8px; }
.btn.danger { background: #8b1e1e; }
.muted { color: var(--muted); }
.money { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.15rem; }
.list { display: grid; gap: 12px; }
.item h3 { margin: 0 0 6px; font-size: 1.15rem; }
.item .meta { color: var(--muted); font-size: .95rem; }
.badge {
  display: inline-block; border-radius: 999px; padding: 6px 12px;
  font-size: .85rem; background: #e8efe9; color: var(--primary); font-weight: 700;
}
.badge.warn { background: #f8e5d8; color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 1rem; }
th, td { border: 1px solid var(--line); padding: 12px; text-align: left; }
th { background: #f0ebe1; }
.right { text-align: right; }
.empty {
  border: 1px dashed var(--line); border-radius: 16px; padding: 36px;
  text-align: center; color: var(--muted); font-size: 1.05rem;
}
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-bottom: 12px; flex-wrap: wrap; }
.photo-box{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.photo-item{display:grid;gap:6px}
.photo-item img{width:100%;height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f0f0f0;display:block}
.photo-item img.broken{background:#eee;min-height:120px}
.el2-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
.el2-photos img{width:100%;height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#f0f0f0;display:block}
.photo-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.photo-lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#111}

.sig-box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin-top:12px}
.sig-canvas{width:100%;height:180px;border:2px dashed #999;border-radius:10px;touch-action:none;background:#fff;display:block}
.sig-canvas.active{border-color:var(--primary)}
.a4-signs img.sig-img{max-width:100%;max-height:45px;display:block;margin-top:4px}
.complete-box{border:2px solid var(--primary);border-radius:14px;padding:14px;background:#f3faf7;margin-top:12px}


@media (max-width: 700px) {
  .grid2, .grid4 { grid-template-columns: 1fr; }
  .app { padding: 12px 12px 110px; }
  .brand img { height: 52px; }
}
@media (min-width: 768px) {
  .app { padding: 20px 24px 40px; }
  .brand img { height: 72px; width: auto; object-fit: contain; }
  .brand h1 { font-size: 1.55rem; }
  .shell-tablet { display: grid; grid-template-columns: 220px 1fr; gap: 18px; align-items: start; }
  .shell-tablet .nav {
    display: grid; gap: 8px; overflow: visible; position: sticky; top: 16px;
  }
  .shell-tablet .nav button {
    border-radius: 14px; text-align: left; width: 100%;
  }
  .list { grid-template-columns: 1fr 1fr; }
  .list > .empty { grid-column: 1 / -1; }
  .grid4 { grid-template-columns: repeat(4, 1fr); }
}
.a4 {
  background: #fff; color: #111; border: 1px solid #111; padding: 10px;
  max-width: 210mm; margin: 0 auto;
}
.a4 img.logo { display: block; width: 100%; max-height: 42mm; object-fit: contain; background: #000; }
.a4-head, .a4-box, .a4-signs > div { border: 1px solid #111; }
.a4-head { display: flex; justify-content: space-between; margin-top: 6px; }
.a4-head > * { padding: 6px 8px; }
.a4-head h2 { margin: 0; font-size: 14px; }
.a4-meta { text-align: right; border-left: 1px solid #111; min-width: 110px; }
.a4-parties { display: grid; grid-template-columns: 1fr 1fr; margin-top: 6px; }
.a4-parties > div { border: 1px solid #111; padding: 6px 8px; }
.a4-parties > div + div { border-left: 0; }
.a4 table { margin-top: 6px; }
.a4 th, .a4 td { border-color: #111; font-size: 11px; }
.a4-total { width: 180px; margin-left: auto; margin-top: 6px; border: 1px solid #111; }
.a4-total p { display: flex; justify-content: space-between; margin: 0; padding: 4px 8px; border-bottom: 1px solid #111; }
.a4-total p:last-child { border: 0; font-weight: 700; background: #f2f2f2; }
.a4-note { border: 1px solid #111; margin-top: 6px; padding: 6px 8px; font-size: 11px; }
.a4-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.a4-signs > div { min-height: 50px; padding: 6px; font-size: 11px; font-weight: 700; }
.a4-foot { text-align: center; font-size: 10px; margin-top: 8px; border-top: 1px solid #111; padding-top: 6px; }
@media print {
  body * { visibility: hidden; }
  #print-area, #print-area * { visibility: visible; }
  #print-area { position: absolute; left: 0; top: 0; width: 100%; }
  .sheet-actions, .nav, .top, .no-print { display: none !important; }
  @page { size: A4; margin: 8mm; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="logo.png" alt="Usta Teknik" />
      <div>
        <h1>Usta Teknik</h1>
        <p>0543 307 40 18 · 0530 609 99 08 · Tablet</p>
      </div>
    </div>
  </header>
  <div class="shell shell-tablet">
    <nav class="nav" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
const PHONES = ["0543 307 40 18", "0530 609 99 08"];
const DIVISIONS = [
  { id: "elektronik", label: "Elektronik" },
  { id: "beyaz", label: "Beyaz eşya" },
  { id: "guvenlik", label: "Güvenlik" },
  { id: "canak", label: "Çanak anten" },
];
const STATUSES = [
  { id: "kabul", label: "Kabul" },
  { id: "tamir", label: "Tamir" },
  { id: "parca", label: "Parça bekliyor" },
  { id: "teslim", label: "Teslim" },
];
const KEY = "usta-teknik-web-v1";

const IS_FILE = location.protocol === "file:";
const API = IS_FILE ? null : (location.origin + "/api/data");
let saveTimer = null;
let syncTimer = null;
let syncing = false;

async function loadFromServer() {
  if (!API) return null;
  try {
    const r = await fetch(API + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return null;
    const data = await r.json();
    return data;
  } catch (e) {
    return null;
  }
}

async function saveToServer(data) {
  if (!API || syncing) return;
  try {
    syncing = true;
    await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
  } catch (e) {
  } finally {
    syncing = false;
  }
}

const VIEWS = [
  { id: "ozet", label: "Özet" },
  { id: "parca", label: "Parça" },
  { id: "servis", label: "Servis" },
  { id: "guvenlik", label: "Kamera / Güvenlik" },
  { id: "ikinciel", label: "2. El Ürün" },
  { id: "musteri", label: "Müşteri" },
  { id: "kasa", label: "Kasa" },
  { id: "teklif", label: "Teklif" },
];
const GV_STATUS = [
  { id: "plan", label: "Planlandı" },
  { id: "kurulum", label: "Kurulumda" },
  { id: "test", label: "Test" },
  { id: "tamam", label: "İşlem bitti" },
];


function uid() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
function money(n) {
  return new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 0 }).format(Math.round(n || 0));
}
function day(iso) {
  try { return new Date(iso).toLocaleDateString("tr-TR"); } catch { return ""; }
}
function num(v) {
  const n = Number(String(v).replace(",", "."));
  return Number.isFinite(n) ? n : 0;
}
function normalizeState(data) {
  data = data || {};
  return {
    parts: data.parts || [],
    jobs: data.jobs || [],
    customers: data.customers || [],
    debts: data.debts || [],
    entries: data.entries || [],
    quotes: data.quotes || [],
    ikinciEl: data.ikinciEl || [],
    guvenlik: data.guvenlik || [],
    updatedAt: data.updatedAt || 0,
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return empty();
    return normalizeState(JSON.parse(raw));
  } catch {
    return empty();
  }
}
function empty() {
  return { parts: [], jobs: [], customers: [], debts: [], entries: [], quotes: [], ikinciEl: [], guvenlik: [], updatedAt: 0 };
}
function save() {
  try {
    state.updatedAt = Date.now();
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    try {
      alert("Kayıt yapılamadı (hafıza dolu olabilir). Bazı fotoğrafları silip tekrar deneyin.");
    } catch (e2) {}
  }
  if (API) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveToServer(state); }, 500);
  }
}
function pushCash(entry) {
  if (!entry || !(entry.amount > 0)) return null;
  if (!entry.id) entry.id = uid();
  if (!entry.at) entry.at = new Date().toISOString();
  if (!entry.title) entry.title = entry.note || "Kasa hareketi";
  if (!entry.kind) entry.kind = "gelir";
  // aynı id varsa güncelle
  state.entries = state.entries.filter(e => e.id !== entry.id);
  state.entries.unshift(entry);
  return entry.id;
}

let state = load();
let view = "ozet";
let armedDelete = null;
let formJobId = null;
let formQuoteId = null;
let formGvId = null;

function jobTotal(job) {
  const gross = (job.fee || 0) + (job.lines || []).reduce((s, l) => s + l.price * l.qty, 0);
  const discount = Math.min(Math.max(0, job.discount || 0), gross);
  return gross - discount;
}


function syncAllCash() {
  if (!Array.isArray(state.entries)) state.entries = [];
  // Servis fişleri
  for (const job of state.jobs || []) {
    const total = jobTotal(job);
    if (total > 0) postJobCash(job);
    else if (job.cashId) {
      state.entries = state.entries.filter(e => e.id !== job.cashId);
      job.cashId = undefined;
    }
  }
  // Güvenlik — sadece tamam olanlar veya ucreti olanlar
  for (const g of state.guvenlik || []) {
    if ((g.fee || 0) > 0 && (g.status === "tamam" || g.cashId)) {
      const id = g.cashId || uid();
      g.cashId = id;
      pushCash({
        id,
        kind: "gelir",
        category: "Güvenlik",
        title: [g.no, g.customer, "Kamera"].filter(Boolean).join(" · "),
        amount: g.fee || 0,
      });
    }
  }
  // 2. El satılanlar
  for (const it of state.ikinciEl || []) {
    if (it.status === "satildi" && (it.price || 0) > 0) {
      const id = it.cashId || uid();
      it.cashId = id;
      pushCash({
        id,
        kind: "gelir",
        category: "2. El",
        title: "2. El · " + (it.title || ""),
        amount: it.price || 0,
      });
    }
  }
}

function postJobCash(job) {
  const total = jobTotal(job);
  if (total <= 0) {
    if (job.cashId) state.entries = state.entries.filter(e => e.id !== job.cashId);
    job.cashId = undefined;
    return;
  }
  const id = job.cashId || uid();
  job.cashId = id;
  pushCash({
    id,
    kind: "gelir",
    category: "Servis",
    title: [job.no, job.customer, job.device || job.work].filter(Boolean).join(" · "),
    amount: total,
    at: job.openedAt || new Date().toISOString(),
  });
}

function nextJobNo() {
  let max = 1000;
  for (const j of state.jobs) {
    const n = Number(String(j.no).replace(/\D/g, ""));
    if (Number.isFinite(n)) max = Math.max(max, n);
  }
  return "SF-" + (max + 1);
}
function nextGvNo() {
  let max = 5000;
  for (const g of (state.guvenlik || [])) {
    const n = Number(String(g.no).replace(/\D/g, ""));
    if (Number.isFinite(n)) max = Math.max(max, n);
  }
  return "GK-" + (max + 1);
}
function nextQuoteNo() {
  let max = 2400;
  for (const q of state.quotes) {
    const n = Number(String(q.no).replace(/\D/g, ""));
    if (Number.isFinite(n)) max = Math.max(max, n);
  }
  return "TK-" + (max + 1);
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function render() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  for (const v of VIEWS) {
    const b = document.createElement("button");
    b.textContent = v.label;
    if (v.id === view) b.classList.add("active");
    b.onclick = () => { view = v.id; formJobId = null; formQuoteId = null; formGvId = null; armedDelete = null; render(); };
    nav.appendChild(b);
  }
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (view === "ozet") main.appendChild(viewOzet());
  if (view === "parca") main.appendChild(viewParca());
  if (view === "servis") main.appendChild(viewServis());
  if (view === "guvenlik") main.appendChild(viewGuvenlik());
  if (view === "ikinciel") main.appendChild(viewIkinciEl());
  if (view === "musteri") main.appendChild(viewMusteri());
  if (view === "kasa") main.appendChild(viewKasa());
  if (view === "teklif") main.appendChild(viewTeklif());
}

function viewOzet() {
  const open = state.jobs.filter(j => j.status !== "teslim").length;
  const stock = state.parts.reduce((s, p) => s + (p.stock || 0), 0);
  const gelir = state.entries.filter(e => e.kind === "gelir").reduce((s, e) => s + e.amount, 0);
  const gider = state.entries.filter(e => e.kind === "gider").reduce((s, e) => s + e.amount, 0);
  const debt = state.debts.filter(d => !d.paid).reduce((s, d) => s + d.amount, 0);
  const el2 = (state.ikinciEl || []).filter(x => x.status === "satilik").length;
  const box = el(`<div>
    <div class="grid2">
      <div class="card"><div class="muted">Açık servis</div><div style="font-size:1.6rem;font-weight:700">${open}</div></div>
      <div class="card"><div class="muted">Parça stok adedi</div><div style="font-size:1.6rem;font-weight:700">${stock}</div></div>
      <div class="card"><div class="muted">Kasa bakiyesi</div><div class="money" style="font-size:1.4rem">${money(gelir - gider)}</div></div>
      <div class="card"><div class="muted">2. El satılık</div><div style="font-size:1.6rem;font-weight:700">${el2}</div></div>
    </div>
    <div class="card"><p class="muted" style="margin:0">Veriler bu tarayıcıda saklanır. 2. El menüsünden foto ve fiyat ekleyebilirsiniz.</p></div>
  </div>`);
  return box;
}

function viewParca() {
  const root = el(`<div>
    <div class="card">
      <h2 style="margin:0 0 10px">Yeni parça</h2>
      <form id="part-form" class="grid2"></form>
    </div>
    <div class="list" id="part-list"></div>
  </div>`);
  const form = root.querySelector("#part-form");
  form.innerHTML = `
    <label class="block"><span>Ad</span><input class="field" name="name" required></label>
    <label class="block"><span>Kod / SKU</span><input class="field" name="sku"></label>
    <label class="block"><span>Bölüm</span>
      <select class="field" name="division">${DIVISIONS.filter(d => d.id !== "guvenlik").map(d => `<option value="${d.id}">${d.label}</option>`).join("")}</select>
    </label>
    <label class="block"><span>Stok</span><input class="field" name="stock" inputmode="numeric" value="0"></label>
    <label class="block"><span>Fiyat (TL)</span><input class="field" name="price" inputmode="numeric" value="0"></label>
    <div class="row"><button class="btn accent" type="submit">Parça ekle</button></div>`;
  form.onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    state.parts.unshift({
      id: uid(),
      name: String(fd.get("name") || "").trim(),
      sku: String(fd.get("sku") || "").trim(),
      division: String(fd.get("division")),
      stock: Math.max(0, Math.round(num(fd.get("stock")))),
      price: Math.max(0, Math.round(num(fd.get("price")))),
    });
    save(); render();
  };
  const list = root.querySelector("#part-list");
  if (!state.parts.length) list.appendChild(el(`<div class="empty">Henüz parça yok.</div>`));
  for (const p of state.parts) {
    const div = DIVISIONS.find(d => d.id === p.division)?.label || p.division;
    const item = el(`<div class="card item">
      <div class="row" style="justify-content:space-between">
        <div>
          <h3>${escapeHtml(p.name)}</h3>
          <div class="meta">${escapeHtml(p.sku || "—")} · ${div} · Stok ${p.stock}</div>
        </div>
        <div class="money">${money(p.price)}</div>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn line" data-in>+1 stok</button>
        <button class="btn line" data-out>-1 stok</button>
        <button class="btn quiet" data-del>${armedDelete === p.id ? "Silinsin mi?" : "Sil"}</button>
      </div>
    </div>`);
    item.querySelector("[data-in]").onclick = () => { p.stock += 1; save(); render(); };
    item.querySelector("[data-out]").onclick = () => { p.stock = Math.max(0, p.stock - 1); save(); render(); };
    item.querySelector("[data-del]").onclick = () => {
      if (armedDelete !== p.id) { armedDelete = p.id; render(); return; }
      state.parts = state.parts.filter(x => x.id !== p.id);
      armedDelete = null; save(); render();
    };
    list.appendChild(item);
  }
  return root;
}

function viewServis() {
  if (formJobId) {
    const job = state.jobs.find(j => j.id === formJobId);
    if (job) return serviceForm(job);
  }
  const root = el(`<div>
    <div class="card">
      <h2 style="margin:0 0 10px">Yeni servis fişi</h2>
      <form id="job-form" class="grid2"></form>
    </div>
    <div class="list" id="job-list"></div>
  </div>`);
  const form = root.querySelector("#job-form");
  form.innerHTML = `
    <label class="block"><span>Müşteri</span><input class="field" name="customer" list="custs" required></label>
    <label class="block"><span>Telefon</span><input class="field" name="phone" inputmode="tel"></label>
    <label class="block" style="grid-column:1/-1"><span>Adres</span><input class="field" name="address"></label>
    <label class="block"><span>Bölüm</span>

    save();

  };

function rememberCustomer(name, phone, address) {
  if (!name) return;
  const known = state.customers.find(c =>
    (phone && c.phone.replace(/\D/g, "") === phone.replace(/\D/g, "")) ||
    c.name.toLocaleLowerCase("tr-TR") === name.toLocaleLowerCase("tr-TR")
  );
  if (known) {
    known.name = name;
    if (phone) known.phone = phone;
    if (address) known.address = address;
  } else {
    state.customers.unshift({ id: uid(), name, phone, address });
  }
}

    card.querySelector("[data-el2-price]").onchange = (e) => {
      it.price = Math.max(0, Math.round(num(e.target.value)));

    };
    card.querySelector("[data-el2-status]").onchange = (e) => {
      it.status = e.target.value;
      // sold -> optional cash entry
      if (it.status === "satildi" && (it.price || 0) > 0) {
        const id = it.cashId || uid();
        it.cashId = id;
        pushCash({
          id,
          kind: "gelir",
          category: "2. El",
          title: "2. El satış · " + (it.title || ""),
          amount: it.price || 0,
        });
      }
      save(); render();
    };
    card.querySelector("[data-el2-photo]").onchange = async (e) => {
      const files = e.target.files;
      if (!files || !files.length) return;
      if (!it.photos) it.photos = [];
      for (const f of Array.from(files).slice(0, 6)) {
        if (it.photos.length >= 8) break;
        if (!f.type || !f.type.startsWith("image/")) continue;
        try {

          if (data && data.indexOf("data:image") === 0) it.photos.push({ id: uid(), data });

      }
      save(); render();
    };
    card.querySelector("[data-el2-del]").onclick = () => {
      if (!confirm("Bu 2. el ürün silinsin mi?")) return;

      save(); render();

list.appendChild(card);

    tr.querySelector("[data-q]").onchange = (e) => { l.qty = Math.max(1, Math.round(num(e.target.value))); save(); render(); };
    tr.querySelector("[data-pr]").onchange = (e) => { l.price = Math.max(0, Math.round(num(e.target.value))); save(); render(); };
    tr.querySelector("[data-ql-del]").onclick = () => { q.lines.splice(i, 1); save(); render(); };
    tbody.appendChild(tr);
  });
  root.querySelector("#back").onclick = () => { formQuoteId = null; render(); };
  root.querySelector("#print").onclick = () => doPrint();
  root.querySelector("#addline").onclick = () => { q.lines.push({ name: "", qty: 1, price: 0 }); save(); render(); };
  root.querySelector("#q-from-stock").onclick = () => {
    const id = root.querySelector("#q-stock").value;
    const qty = Math.max(1, Math.round(num(root.querySelector("#q-stock-qty").value || 1)));
    if (!id) { alert("Stoktan parça seçin"); return; }
    const p = state.parts.find(x => x.id === id);
    if (!p) return;
    q.lines.push({ name: p.name, qty, price: p.price || 0, partId: p.id });
    save(); render();
  };
  root.querySelector("[data-c]").onchange = (e) => { q.customer = e.target.value; save(); };
  root.querySelector("[data-p]").onchange = (e) => { q.phone = e.target.value; save(); };
  root.querySelector("[data-a]").onchange = (e) => { q.address = e.target.value; save(); };
  root.querySelector("[data-pl]").onchange = (e) => { q.place = e.target.value; save(); };
  return root;
}



function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("dosya okunamadi"));
    reader.readAsDataURL(file);
  });
}
function compressPhoto(file, maxSide, quality) {
  // Eski Android WebView: canvas bozulup yesil/beyaz cikiyor.
  // Once orijinali dene; sadece cok buyukse kucult.
  return readFileAsDataURL(file).then((raw) => {
    if (!raw || typeof raw !== "string" || raw.indexOf("data:image") !== 0) {
      return Promise.reject(new Error("gecersiz resim"));
    }
    // Kucuk JPEG/PNG ise canvas kullanma
    const isJpeg = /image\/jpe?g/i.test(file.type || "") || raw.indexOf("data:image/jpeg") === 0;
    const isPng = /image\/png/i.test(file.type || "") || raw.indexOf("data:image/png") === 0;
    if ((isJpeg || isPng) && file.size && file.size < 900000) {
      return raw;
    }
    maxSide = maxSide || 1024;
    quality = quality || 0.8;
    return new Promise((resolve) => {
      const img = new Image();
      let done = false;
      const finish = (val) => { if (!done) { done = true; resolve(val || raw); } };
      img.onload = () => {
        try {
          let w = img.naturalWidth || img.width || 1;
          let h = img.naturalHeight || img.height || 1;
          if (w < 2 || h < 2) { finish(raw); return; }
          const scale = Math.min(1, maxSide / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          if (!ctx) { finish(raw); return; }
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          let out = null;
          try { out = canvas.toDataURL("image/jpeg", quality); } catch (e) { out = null; }
          if (out && out.length > 100 && out.indexOf("data:image") === 0) finish(out);
          else finish(raw);
        } catch (e) { finish(raw); }
      };
      img.onerror = () => finish(raw);
      setTimeout(() => finish(raw), 8000);
      img.src = raw;
    });
  });
}

function wireSignaturePad(canvas, job) {
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  function resize() {
    const w = canvas.clientWidth || 320;
    const h = canvas.clientHeight || 180;
    canvas.width = Math.floor(w * ratio);
    canvas.height = Math.floor(h * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#111";
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);
    if (job.signature) {
      const im = new Image();
      im.onload = () => ctx.drawImage(im, 0, 0, w, h);
      im.src = job.signature;
    }
  }
  resize();
  let drawing = false;
  let last = null;
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches && e.touches[0] ? e.touches[0] : e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    last = pos(e);
    canvas.classList.add("active");
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function end(e) {
    if (!drawing) return;
    e.preventDefault();
    drawing = false;
    last = null;
    canvas.classList.remove("active");
  }
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);
  canvas.addEventListener("touchcancel", end);
  return {
    clear() {
      const w = canvas.clientWidth || 320;
      const h = canvas.clientHeight || 180;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
    },
    save() {
      try {
        return canvas.toDataURL("image/png");
      } catch (e) {
        return null;
      }
    }
  };
}

function openPhotoBig(src) {
  if (!src) return;
  const box = document.createElement("div");
  box.className = "photo-lightbox";
  const im = document.createElement("img");
  im.src = src;
  im.alt = "Foto";
  im.onerror = function () { im.replaceWith(document.createTextNode("Resim acilamadi")); };
  box.appendChild(im);
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

function wirePhotos(root, job) {

}



function waDigits(phone) {
  let d = String(phone || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.startsWith("00")) d = d.slice(2);
  if (d.startsWith("0")) d = "90" + d.slice(1);
  if (d.length === 10 && d.startsWith("5")) d = "90" + d;
  if (d.length === 11 && d.startsWith("05")) d = "9" + d.slice(1);
  return d;
}
function openExternalUrl(url) {
  try {
    if (window.UstaApp && typeof window.UstaApp.openUrl === "function") {
      window.UstaApp.openUrl(String(url));
      return;
    }
  } catch (e) {}
  try {
    // WhatsApp intent (Android)
    if (url.indexOf("wa.me") >= 0 || url.indexOf("whatsapp") >= 0) {
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
      // yedek
      setTimeout(function () {
        try { window.location.href = url; } catch (e2) {}
      }, 300);
      return;
    }
  } catch (e) {}
  try { window.location.href = url; } catch (e3) {}
}
function openWhatsAppForJob(job) {
  const digits = waDigits(job.phone);
  if (!digits) {
    alert("Müşteri telefonu yok. Önce telefon girin.");
    return;
  }
  const text = encodeURIComponent(buildWhatsAppMessage(job));
  // whatsapp:// daha iyi açılır bazı cihazlarda
  const intentUrl = "whatsapp://send?phone=" + digits + "&text=" + text;
  const webUrl = "https://wa.me/" + digits + "?text=" + text;
  try {
    if (window.UstaApp && typeof window.UstaApp.openWhatsApp === "function") {
      window.UstaApp.openWhatsApp(digits, buildWhatsAppMessage(job));
      return;
    }
  } catch (e) {}
  openExternalUrl(intentUrl);
  setTimeout(function () { openExternalUrl(webUrl); }, 600);
}


function doPrint() {
  try {
    if (window.UstaPrint && typeof window.UstaPrint.print === 'function') {
      window.UstaPrint.print();
      return;
    }
  } catch (e) {}
  window.print();
}
function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}


async function boot() {
  let remote = null;
  if (API) {
    remote = await loadFromServer();
    if (remote) {
      const local = load();
      const rAt = remote.updatedAt || 0;
      const lAt = local.updatedAt || 0;
      if (rAt >= lAt) state = normalizeState(remote);
      else {
        state = local;
        await saveToServer(state);
      }
    }
    // ortak cihaz: periyodik cek
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(async function () {
      const remote = await loadFromServer();
      if (!remote) return;
      const rAt = remote.updatedAt || 0;
      if (rAt > (state.updatedAt || 0)) {
        state = normalizeState(remote);
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        render();
      }
    }, 4000);
  }
  render();
  // baslikta ortak mod
  try {
    const brand = document.querySelector(".brand div div");
    if (brand && API) brand.textContent = "Ortak panel · telefon + tablet";
  } catch (e) {}
}
boot();
